services:
  nats:
    image: nats:2.12-alpine
    tmpfs:
      - /data
  qol-api:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      args:
        COMMAND: qol-api
    command: ["serve", "--nats-url", "nats://nats:4222", "--allowed-origin", "http://web", "--data-dir", "/var/lib/qol"]
    tmpfs:
      - /var/lib/qol
    depends_on:
      - nats
  capture:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      args:
        COMMAND: qol-worker
    command: ["run", "--type", "capture", "--nats-url", "nats://nats:4222"]
    depends_on:
      - nats
  record-en:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      args:
        COMMAND: qol-worker
    command: ["run", "--type", "record", "--name", "record-en", "--input", "graph.record-en.input", "--output", "graph.record-en.completed", "--nats-url", "nats://nats:4222", "--output-dir", "/output"]
    tmpfs:
      - /output
      - /tmp/qol
    depends_on:
      - nats
  record-es:
    build:
      context: .
      dockerfile: docker/go.Dockerfile
      args:
        COMMAND: qol-worker
    command: ["run", "--type", "record", "--name", "record-es", "--input", "graph.record-es.input", "--output", "graph.record-es.completed", "--nats-url", "nats://nats:4222", "--output-dir", "/output"]
    tmpfs:
      - /output
      - /tmp/qol
    depends_on:
      - nats
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      - qol-api
  e2e:
    image: busybox:1.37
    command: ["sh", "-c", "until wget -q -O /dev/null http://qol-api:8080/healthz; do sleep 1; done; until wget -q -O /dev/null http://web; do sleep 1; done"]
    depends_on:
      - web
