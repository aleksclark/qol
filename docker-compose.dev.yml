services:
  nats:
    image: nats:2.12-alpine
    command: ["-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
  qol-api:
    build:
      context: .
      dockerfile: docker/go.dev.Dockerfile
    command: ["air", "-c", ".air.api.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_ALLOWED_ORIGIN: http://localhost:9876
      QOL_TLS_CERT: /certs/localhost.pem
      QOL_TLS_KEY: /certs/localhost-key.pem
      QOL_DATA_DIR: /var/lib/qol
    volumes:
      - .:/app
      - ./.dev-certs:/certs:ro
      - go-cache:/go/pkg/mod
      - api-data:/var/lib/qol
    ports:
      - "9875:8080"
      - "4443:4443/udp"
    depends_on:
      nats:
        condition: service_started
  capture:
    build:
      context: .
      dockerfile: docker/go.dev.Dockerfile
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_TYPE: capture
    volumes:
      - .:/app
      - go-cache:/go/pkg/mod
    depends_on:
      - nats
  stt-whisper:
    build:
      context: .
      dockerfile: docker/stt-whisper.Dockerfile
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_TYPE: stt-whisper
      QOL_SPOOL_DIR: /spool
    volumes:
      - .:/app
      - ./e2e/processors/stt_whisper.py:/processors/stt_whisper.py
      - go-cache:/go/pkg/mod
      - pipeline-spool:/spool
    depends_on:
      - nats
  translate:
    build:
      context: .
      dockerfile: docker/translate.Dockerfile
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_TYPE: translate
      QOL_SPOOL_DIR: /spool
    volumes:
      - .:/app
      - ./e2e/processors/translate_en_es.py:/processors/translate_en_es.py
      - go-cache:/go/pkg/mod
      - pipeline-spool:/spool
    depends_on:
      - nats
  tts:
    build:
      context: .
      dockerfile: docker/tts.Dockerfile
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_TYPE: tts
      QOL_SPOOL_DIR: /spool
    volumes:
      - .:/app
      - ./e2e/processors/tts_spanish.py:/processors/tts_spanish.py
      - go-cache:/go/pkg/mod
      - pipeline-spool:/spool
    depends_on:
      - nats
  record-en:
    build:
      context: .
      dockerfile: docker/go.dev.Dockerfile
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_TYPE: record
      QOL_NAME: record-en
      QOL_INPUT: pipeline.record-en.input
      QOL_OUTPUT: pipeline.record-en.completed
      QOL_SPOOL_DIR: /spool
      QOL_OUTPUT_DIR: /output
    volumes:
      - .:/app
      - go-cache:/go/pkg/mod
      - pipeline-spool:/spool
      - ./tmp:/output
    depends_on:
      - nats
  record-es:
    build:
      context: .
      dockerfile: docker/go.dev.Dockerfile
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_TYPE: record
      QOL_NAME: record-es
      QOL_INPUT: pipeline.record-es.input
      QOL_OUTPUT: pipeline.record-es.completed
      QOL_SPOOL_DIR: /spool
      QOL_OUTPUT_DIR: /output
    volumes:
      - .:/app
      - go-cache:/go/pkg/mod
      - pipeline-spool:/spool
      - ./tmp:/output
    depends_on:
      - nats
  web:
    image: node:24.15.0-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      VITE_API_ORIGIN: http://localhost:9875
      VITE_WEBTRANSPORT_ORIGIN: https://localhost:4443
      VITE_WEBTRANSPORT_CERT_HASH: ${VITE_WEBTRANSPORT_CERT_HASH}
    volumes:
      - ./web:/app
      - web-modules:/app/node_modules
    ports:
      - "9876:5173"
    depends_on:
      - qol-api
volumes:
  api-data:
  go-cache:
  web-modules:
  pipeline-spool:
