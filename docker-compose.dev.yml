services:
  nats:
    image: nats:2.12-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-dev:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 2s
      retries: 10
  qol-api:
    build:
      context: .
      dockerfile: docker/go.dev.Dockerfile
    command: ["air", "-c", ".air.api.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
      QOL_ALLOWED_ORIGIN: http://localhost:9876
      QOL_TLS_CERT: /certs/localhost.pem
      QOL_TLS_KEY: /certs/localhost-key.pem
    volumes:
      - .:/app
      - ./.dev-certs:/certs:ro
      - go-cache:/go/pkg/mod
    ports:
      - "9875:8080"
      - "4443:4443/udp"
    depends_on:
      nats:
        condition: service_started
  qol-worker:
    build:
      context: .
      dockerfile: docker/go.dev.Dockerfile
    command: ["air", "-c", ".air.worker.toml"]
    environment:
      QOL_NATS_URL: nats://nats:4222
    volumes:
      - .:/app
      - go-cache:/go/pkg/mod
    deploy:
      replicas: 2
    depends_on:
      nats:
        condition: service_started
  web:
    image: node:24.15.0-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev"]
    environment:
      VITE_API_ORIGIN: http://localhost:9875
      VITE_WEBTRANSPORT_ORIGIN: https://localhost:4443
      VITE_WEBTRANSPORT_CERT_HASH: ${VITE_WEBTRANSPORT_CERT_HASH}
    volumes:
      - ./web:/app
      - web-modules:/app/node_modules
    ports:
      - "9876:5173"
    depends_on:
      - qol-api
volumes:
  nats-dev:
  go-cache:
  web-modules:
