syntax = "proto3";

package qol.v1;

option go_package = "github.com/aleksclark/qol/gen/qol/v1;qolv1";

import "google/protobuf/timestamp.proto";

message MediaSpan {
  int64 start_ns = 1;
  int64 end_ns = 2;
}

enum PcmSampleFormat {
  PCM_SAMPLE_FORMAT_UNSPECIFIED = 0;
  PCM_SAMPLE_FORMAT_S16_LE = 1;
}

message PcmChunk {
  uint32 sample_rate_hz = 1;
  uint32 channel_count = 2;
  PcmSampleFormat sample_format = 3;
  uint32 frame_count = 4;
  bytes interleaved_samples = 5;
}

message Event {
  string event_id = 1;
  string session_id = 2;
  uint64 sequence = 3;
  MediaSpan span = 4;
  repeated string parent_event_ids = 5;
  google.protobuf.Timestamp produced_at = 6;
  oneof payload {
    PcmChunk pcm = 10;
  }
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
}

message CurrentUserRequest {}

message CurrentUserResponse {
  User user = 1;
}

message User {
  string username = 1;
  bool admin = 2;
}

message CreateUploadTicketRequest {}

message CreateUploadTicketResponse {
  string ticket = 1;
  int64 expires_at_unix = 2;
}

message StartUpload {
  string name = 1;
  uint64 size_bytes = 2;
}

message Mp3Chunk {
  uint64 sequence = 1;
  bytes data = 2;
  bool end_of_stream = 3;
}

message CancelUpload {}

message ClientFrame {
  oneof body {
    StartUpload start_upload = 1;
    Mp3Chunk mp3_chunk = 2;
    CancelUpload cancel_upload = 3;
  }
}

message UploadAccepted {
  string session_id = 1;
}

message UploadCompleted {
  uint64 input_events = 1;
  uint64 output_events = 2;
}

message Error {
  string code = 1;
  string message = 2;
}

message ServerFrame {
  oneof body {
    UploadAccepted upload_accepted = 1;
    Event output_event = 2;
    UploadCompleted upload_completed = 3;
    Error error = 4;
  }
}

message UserRecord {
  string username = 1;
  bool admin = 2;
  bytes password_salt = 3;
  bytes password_hash = 4;
  int64 created_at_unix = 5;
}

message SessionRecord {
  string username = 1;
  int64 expires_at_unix = 2;
}

message UploadTicketRecord {
  string username = 1;
  int64 expires_at_unix = 2;
}
