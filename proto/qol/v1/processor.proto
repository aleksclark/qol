syntax = "proto3";

package qol.v1;

option go_package = "github.com/aleksclark/qol/gen/qol/v1;qolv1";

import "qol/v1/qol.proto";

message RecognizedUtterance {
  MediaSpan span = 1;
  string text = 2;
}

message SynthesisRequest {
  string text = 1;
  string language = 2;
  ProsodyPayload prosody = 3;
  float pace = 4;
}

message SynthesisChunk {
  PcmFormat format = 1;
  bytes data = 2;
  bool end_of_utterance = 3;
}

message EmotionResult {
  string label = 1;
  float confidence = 2;
  repeated EmotionScore scores = 3;
}

message TranslatorRequest {
  string session_id = 1;
  oneof request {
    TranslateTurn turn = 2;
    CondenseTurns condense = 3;
    SummarizeContext summarize = 4;
    GlossaryUpdate glossary = 5;
    EndSession end = 6;
  }
}

message TranslateTurn {
  uint64 turn_id = 1;
  string text = 2;
  bool final = 3;
}

message CondenseTurns {
  repeated uint64 turn_ids = 1;
  float target_ratio = 2;
}

message SummarizeContext {}

message GlossaryUpdate {
  repeated GlossaryEntry entries = 1;
}

message EndSession {}

message TranslatorResponse {
  string text = 1;
  uint32 context_turns = 2;
}
